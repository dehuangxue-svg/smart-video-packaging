name: Source and desktop checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Ensure FFmpeg is available for audio checks
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Unit and timeline checks (no model weights)
        run: |
          python -m unittest discover -s tests -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/test_edit_core.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/test_desktop_bridge.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows desktop host
        shell: powershell
        run: .\desktop\build.ps1
